
name: Hello World CI

on:
  push:
    branches:
      - main
      - 'test/**'
      - 'test/branch-protection'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Print greeting
        run: echo "Hello World from GitHub Actions!"

      - name: Verify Python
        run: python --version

      - name: Run calculator unit tests
        run: python -m unittest -v test_calculator.py
